services:
  app:
    build: .
    container_name: aieducenter-identity-web
    restart: unless-stopped
    ports:
      - "10002:10002"
    env_file:
      - .env.production
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10002/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  webnet:
    external: true
